# ============================================================
# Production Environment Configuration
# ============================================================
spring.config.activate.on-profile=prod

# Database Configuration (PostgreSQL)
spring.datasource.url=${TN_PROD_DB_URL}
spring.datasource.username=${TN_PROD_DB_USERNAME}
spring.datasource.password=${TN_PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Configuration
spring.data.redis.host=${TN_REDIS_HOST}
spring.data.redis.port=${TN_REDIS_PORT}
spring.data.redis.password=${TN_REDIS_PASSWORD}

# App Security & JWT Settings
app.jwt.secret=${TN_JWT_SECRET}
app.jwt.expiration-ms=${TN_JWT_EXPIRY_MS}
app.cors.allowed-origins=${TN_CORS_ALLOWED_ORIGINS}

# Logging Settings
logging.level.root=WARN
logging.level.com.tronhanh=INFO
